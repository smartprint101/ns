<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>অফলাইন · এনএস ট্রেডার্স</title>
    <style>
      body { font-family: "Hind Siliguri", "Noto Sans Bengali", system-ui, sans-serif; background: #f1f5f9; color: #0f172a; display: grid; place-items: center; min-height: 100vh; margin: 0; }
      .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 32px; text-align: center; max-width: 320px; }
      .mark { width: 56px; height: 56px; border-radius: 14px; background: #1c5344; color: #fff; display: grid; place-items: center; font-size: 22px; font-weight: 700; margin: 0 auto 16px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #64748b; margin: 0 0 20px; }
      a { display: inline-block; background: #1c5344; color: #fff; padding: 10px 20px; border-radius: 10px; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">এনএস</div>
      <h1>ইন্টারনেট সংযোগ নেই</h1>
      <p>সংযোগ ফিরলে পেজটি নতুন করে খুলুন।</p>
      <a href="/">আবার চেষ্টা করুন</a>
    </div>
  </body>
</html>
